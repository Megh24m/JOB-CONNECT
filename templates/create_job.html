{% extends 'base.html' %}

{% block content %}

    <div class="dashboard-header" style="margin-bottom: 30px;">
        <div>
            <h1>Post a Job ➕</h1>
            <p>Fill out the details to post a new job vacancy</p>
        </div>
    </div>

    <div class="activity-section-custom" style="max-width: 700px; margin: 0 auto;">
        <div style="background: white; border: 1px solid #f3e0e5; padding: 40px; border-radius: 18px; box-shadow: 0 10px 25px rgba(93,49,64,.05);">
            
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                <div style="margin-bottom: 22px;">
                    <label style="display: block; font-weight: 600; color: #3d1f2a; margin-bottom: 8px; font-size: 15px;">
                        {{ field.label }}
                    </label>
                    <div style="width: 100%;">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <div style="color: #a51d32; font-size: 13px; margin-top: 5px;">
                            {{ field.errors.0 }}
                        </div>
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit" style="width: 100%; padding: 14px; background: #5d3140; color: #ffffff; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px;">
                    Post Job Listing
                </button>
            </form>
        </div>
    </div>

    <style>
        /* Form inputs design overrides */
        .activity-section-custom input, 
        .activity-section-custom textarea, 
        .activity-section-custom select {
            width: 100% !important;
            padding: 12px 16px !important;
            border: 1px solid #d6c4c9 !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            box-sizing: border-box !important;
            transition: all 0.3s ease !important;
        }
        .activity-section-custom input:focus, 
        .activity-section-custom textarea:focus, 
        .activity-section-custom select:focus {
            outline: none !important;
            border-color: #5d3140 !important;
            box-shadow: 0 0 0 2px rgba(93,49,64,.12) !important;
        }
    </style>

{% endblock %}
