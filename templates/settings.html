{% extends 'base.html' %}

{% block content %}
<div style="padding: 40px; background: white; min-height: 80vh; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
    <h1 style="font-size: 28px; margin-bottom: 20px; color: #0f172a;">⚙️ Job Seeker Settings</h1>

    {% if messages %}
    <div style="margin-bottom: 20px;">
        {% for message in messages %}
        <div style="padding: 12px 20px; background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; border-radius: 8px;">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" style="max-width: 500px;">
        {% csrf_token %}
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 30px;">
            <div>
                <strong style="display: block; font-size: 16px; color: #0f172a; margin-bottom: 4px;">Show Date & Time</strong>
                <span style="font-size: 14px; color: #64748b;">Display actual date and time beside status updates and notifications.</span>
            </div>
            <div>
                <!-- Toggle switch -->
                <label class="switch" style="position: relative; display: inline-block; width: 50px; height: 28px;">
                    <input type="checkbox" name="show_datetime" {% if settings.show_datetime %}checked{% endif %} style="opacity: 0; width: 0; height: 0;">
                    <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px;"></span>
                </label>
            </div>
        </div>

        <button type="submit" style="background: #5d3140; color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; width: 100%;">
            Save Settings
        </button>
    </form>
</div>

<style>
.switch input:checked + .slider {
  background-color: #22c55e;
}
.switch input:focus + .slider {
  box-shadow: 0 0 1px #22c55e;
}
.switch .slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}
.switch input:checked + .slider:before {
  transform: translateX(22px);
}
</style>
{% endblock %}
